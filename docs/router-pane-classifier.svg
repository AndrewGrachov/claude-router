<text x="382.8" y="167" fill="#d0d0d0" xml:space="preserve">874 ms</text>
<text x="460.8" y="167" fill="#87d787" xml:space="preserve">● ready</text>
<rect x="24.0" y="172" width="124.8" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="186" fill="#d0d0d0" xml:space="preserve">[ ○ Clef Omni  ]</text>
<text x="156.6" y="186" fill="#7c7c7c" xml:space="preserve">api.cloudflare.com</text>
<text x="320.4" y="186" fill="#7c7c7c" xml:space="preserve">—</text>
<text x="382.8" y="186" fill="#7c7c7c" xml:space="preserve">—</text>
<text x="460.8" y="186" fill="#87d787" xml:space="preserve">● ready</text>
<rect x="24.0" y="191" width="124.8" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="205" fill="#d0d0d0" xml:space="preserve">[ ○ OpenAI     ]</text>
<text x="156.6" y="205" fill="#7c7c7c" xml:space="preserve">api.openai.com</text>
<text x="320.4" y="205" fill="#d0d0d0" xml:space="preserve">70/70</text>
<text x="382.8" y="205" fill="#d0d0d0" xml:space="preserve">286 ms</text>
<text x="460.8" y="205" fill="#d7af5f" xml:space="preserve">○ no API key  </text>
<rect x="570.0" y="191" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="570.0" y="205" fill="#d0d0d0" xml:space="preserve">[ Set up ]</text>
<rect x="24.0" y="210" width="124.8" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="224" fill="#d0d0d0" xml:space="preserve">[ ○ Ollama     ]</text>
<text x="156.6" y="224" fill="#87d787" xml:space="preserve">this machine</text>
<text x="320.4" y="224" fill="#d0d0d0" xml:space="preserve">66/70</text>
<text x="382.8" y="224" fill="#d0d0d0" xml:space="preserve">3483 ms</text>
<text x="460.8" y="224" fill="#87d787" xml:space="preserve">● ready</text>
<text x="24.0" y="243" fill="#7c7c7c" xml:space="preserve">  probe: test prompts with a known activity it answered right, and its p95 wait</text>
<text x="24.0" y="281" fill="#5fafd7" font-weight="700" xml:space="preserve">CLEF FLASH</text>
<text x="102.0" y="281" fill="#7c7c7c" xml:space="preserve"> · active</text>
<text x="24.0" y="300" fill="#d0d0d0" xml:space="preserve">Deadline</text>
<text x="117.6" y="300" fill="#d0d0d0" xml:space="preserve">3000 ms ▾</text>
<text x="211.2" y="300" fill="#7c7c7c" xml:space="preserve">p95 874 ms in its probe</text>
<text x="24.0" y="319" fill="#7c7c7c" xml:space="preserve">            past the deadline the turn keeps its model</text>
<text x="24.0" y="338" fill="#d0d0d0" xml:space="preserve">Sends</text>
<text x="117.6" y="338" fill="#d0d0d0" xml:space="preserve">prompt + 6 recent turns → api.cloudflare.com</text>
<text x="24.0" y="357" fill="#d0d0d0" xml:space="preserve">Health</text>
<text x="117.6" y="357" fill="#d0d0d0" xml:space="preserve">not paused</text>
<text x="195.6" y="357" fill="#d0d0d0" xml:space="preserve"> · 0 recent failures</text>
<text x="24.0" y="376" fill="#d0d0d0" xml:space="preserve">Credentials</text>
<rect x="117.6" y="362" width="62.4" height="18" rx="4" fill="#2e3340"/>
<text x="117.6" y="376" fill="#d0d0d0" xml:space="preserve">[ Edit ]</text>
<text x="180.0" y="376" fill="#7c7c7c" xml:space="preserve">  opens /plugin configure</text>
<text x="24.0" y="414" fill="#5fafd7" font-weight="700" xml:space="preserve">ACROSS SESSIONS · since the last reset</text>
<text x="24.0" y="433" fill="#d0d0d0" xml:space="preserve">Labelled   83 turns</text>
<text x="24.0" y="452" fill="#d0d0d0" xml:space="preserve">Agreement  classifier vs tools: 78 of 83 turns (94%)</text>
<text x="24.0" y="471" fill="#d0d0d0" xml:space="preserve">Code/ops/explore  classifier vs tools: 78 of 83 turns (94%)</text>
<text x="24.0" y="490" fill="#d0d0d0" xml:space="preserve">Mismatch   code → read 4 · ops → code 1</text>
<text x="24.0" y="509" fill="#d0d0d0" xml:space="preserve">Activity moves  9 taken · 4 refused</text>
<text x="24.0" y="528" fill="#d0d0d0" xml:space="preserve">Escalations  after a cheaper activity move: 0 in 7 moves</text>
<text x="24.0" y="566" fill="#87d787" xml:space="preserve">Saved: classifier Clef → Clef Flash. Applies from the next turn.  </text>
<rect x="538.8" y="552" width="62.4" height="18" rx="4" fill="#2e3340"/>
<text x="538.8" y="566" fill="#d0d0d0" xml:space="preserve">[ Undo ]</text>
<rect x="24.0" y="571" width="70.2" height="18" rx="4" fill="#2e3340"/>
