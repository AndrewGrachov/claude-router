<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 610" role="img" aria-labelledby="title desc">
  <title id="title">Router pane, Classifier tab</title>
  <desc id="desc">One row per classifier to compare: where the prompt goes, its activity probe, its p95 wait and whether its credentials are complete, with Set up for a missing Jev API key; the active classifier’s deadline against its wait, the host that receives the prompt, health and credentials; the agreement with tools across sessions; and Undo after a switch.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .cap { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; fill: #9a988f; }
  </style>
  <rect width="672" height="610" rx="8" fill="#1c1c1c"/>
<rect x="10" y="10" width="652" height="590" rx="6" fill="none" stroke="#3f5f8f"/>
<text x="24.0" y="34" fill="#5fafd7" font-weight="700" xml:space="preserve">ROUTING</text>
<rect x="94.2" y="20" width="62.4" height="18" rx="4" fill="#87afff"/>
<text x="94.2" y="34" fill="#0d1016" font-weight="700" xml:space="preserve">[ ◉ on ]</text>
<rect x="164.4" y="20" width="70.2" height="18" rx="4" fill="#2e3340"/>
<text x="164.4" y="34" fill="#d0d0d0" xml:space="preserve">[ ○ off ]</text>
<text x="250.2" y="34" fill="#87d787" xml:space="preserve">Clef Flash ready</text>
<rect x="24.0" y="39" width="54.6" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="53" fill="#d0d0d0" xml:space="preserve">[ Now ]</text>
<rect x="86.4" y="39" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="86.4" y="53" fill="#d0d0d0" xml:space="preserve">[ Routes ]</text>
<rect x="172.2" y="39" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="172.2" y="53" fill="#d0d0d0" xml:space="preserve">[ Policy ]</text>
<rect x="258.0" y="39" width="109.2" height="18" rx="4" fill="#87afff"/>
<text x="258.0" y="53" fill="#0d1016" font-weight="700" xml:space="preserve">[ Classifier ]</text>
<rect x="375.0" y="39" width="70.2" height="18" rx="4" fill="#2e3340"/>
<text x="375.0" y="53" fill="#d0d0d0" xml:space="preserve">[ Usage ]</text>
<rect x="453.0" y="39" width="39.0" height="18" rx="4" fill="#2e3340"/>
<text x="453.0" y="53" fill="#d0d0d0" xml:space="preserve">[ ? ]</text>
<text x="24.0" y="91" fill="#5fafd7" font-weight="700" xml:space="preserve">CLASSIFIER</text>
<text x="102.0" y="91" fill="#7c7c7c" xml:space="preserve"> · asked once per new turn · a pick saves at once</text>
<text x="24.0" y="110" fill="#7c7c7c" xml:space="preserve">                 prompt goes to       probe   p95       status</text>
<rect x="24.0" y="115" width="124.8" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="129" fill="#d0d0d0" xml:space="preserve">[ ○ Jev        ]</text>
<text x="156.6" y="129" fill="#7c7c7c" xml:space="preserve">api.typesafe.ai</text>
<text x="320.4" y="129" fill="#d0d0d0" xml:space="preserve">70/70</text>
<text x="382.8" y="129" fill="#d0d0d0" xml:space="preserve">299 ms</text>
<text x="460.8" y="129" fill="#d7af5f" xml:space="preserve">○ no API key  </text>
<rect x="570.0" y="115" width="78.0" height="18" rx="4" fill="#2e3340"/>
<text x="570.0" y="129" fill="#d0d0d0" xml:space="preserve">[ Set up ]</text>
<rect x="24.0" y="134" width="124.8" height="18" rx="4" fill="#2e3340"/>
<text x="24.0" y="148" fill="#d0d0d0" xml:space="preserve">[ ○ Clef       ]</text>
<text x="156.6" y="148" fill="#7c7c7c" xml:space="preserve">api.cloudflare.com</text>
<text x="320.4" y="148" fill="#d0d0d0" xml:space="preserve">69/70</text>
<text x="382.8" y="148" fill="#d0d0d0" xml:space="preserve">883 ms</text>
<text x="460.8" y="148" fill="#87d787" xml:space="preserve">● ready</text>
<rect x="24.0" y="153" width="124.8" height="18" rx="4" fill="#87afff"/>
<text x="24.0" y="167" fill="#0d1016" font-weight="700" xml:space="preserve">[ ◉ Clef Flash ]</text>
<text x="156.6" y="167" fill="#7c7c7c" xml:space="preserve">api.cloudflare.com</text>
